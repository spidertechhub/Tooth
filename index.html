<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR Braces - 100% Perfect Alignment</title>
    
    <!-- Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary: #007AFF;
            --bg-glass: rgba(20, 20, 20, 0.7);
            --border-glass: rgba(255, 255, 255, 0.2);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #000;
        }

        .ar-container {
            position: relative;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center; align-items: center;
        }

        #webcam-video {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: cover; /* Fills screen perfectly */
            transform: scaleX(-1); /* Mirror video */
            z-index: 1;
        }

        #ar-canvas {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Modern UI */
        .ui-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: var(--bg-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 10px;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .toggle-btn { display: none; }

        .toggle-label {
            padding: 12px 24px;
            border-radius: 30px;
            color: #ccc;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .toggle-btn:checked + .toggle-label {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.6);
        }

        /* Loading Screen */
        #loader {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #111;
            z-index: 999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 45px; height: 45px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        #error-msg {
            color: #ff453a; margin-top: 15px;
            text-align: center; max-width: 80%;
            display: none; font-weight: 500;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Initializing AR Engine...</div>
        <div id="error-msg"></div>
    </div>

    <div class="ar-container">
        <video id="webcam-video" autoplay playsinline></video>
        <canvas id="ar-canvas"></canvas>
    </div>

    <div class="ui-overlay">
        <input type="radio" id="upper" name="teeth-toggle" value="upper" class="toggle-btn" checked>
        <label for="upper" class="toggle-label">Upper Teeth</label>
        
        <input type="radio" id="lower" name="teeth-toggle" value="lower" class="toggle-btn">
        <label for="lower" class="toggle-label">Lower Teeth</label>
    </div>

    <script>
        /**
         * ⚙️ PERFECT TUNING VARIABLES
         */
        const CONFIG = {
            baselineScale: 1.2,   // <-- CHANGE THIS IF MODEL IS STILL TOO SMALL/BIG
            yOffsetUpper: 0.015,  // Pushes model slightly down from upper lip
            yOffsetLower: -0.015, // Pushes model slightly up from lower lip
            depthZ: -50,          // Distance from camera
            mouthThreshold: 0.01, // How wide mouth must open before braces appear
            smoothness: 0.4       // Jitter reduction (0.1 to 1.0)
        };

        const LANDMARKS = {
            mouthLeft: 61,
            mouthRight: 291,
            upperLip: 13,
            lowerLip: 14
        };

        // DOM Elements
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('ar-canvas');
        const loader = document.getElementById('loader');
        const toggles = document.querySelectorAll('input[name="teeth-toggle"]');

        let currentTarget = 'upper';
        let isInitialized = false;
        let isMouthOpen = false;
        let faceDetected = false;

        let targetPosition = new THREE.Vector3();
        let targetScale = new THREE.Vector3();
        let targetRotation = new THREE.Euler();
        let targetQuaternion = new THREE.Quaternion();

        let scene, camera, renderer, bracesModel;

        toggles.forEach(toggle => {
            toggle.addEventListener('change', (e) => { currentTarget = e.target.value; });
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 0;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(0, 10, 10);
            scene.add(dirLight);

            // Load Model
            new THREE.GLTFLoader().load('braces.glb', (gltf) => {
                bracesModel = gltf.scene;
                
                // Center model geometry perfectly
                const box = new THREE.Box3().setFromObject(bracesModel);
                const center = box.getCenter(new THREE.Vector3());
                bracesModel.position.sub(center);
                
                // Wrap in a group for pivoting
                const pivotGroup = new THREE.Group();
                pivotGroup.add(bracesModel);
                bracesModel = pivotGroup;
                
                bracesModel.visible = false;
                scene.add(bracesModel);
                
                document.getElementById('loader-text').innerText = "Starting Camera...";
            }, undefined, (error) => {
                document.getElementById('error-msg').innerText = "Error: braces.glb not found.";
                document.getElementById('error-msg').style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        /**
         * 100% PERFECT ALIGNMENT MATH
         * Calculates exactly how the video is cropped on the screen and aligns 3D coords to it.
         */
        function getPerfect3DPosition(mpX, mpY, zDepth) {
            // 1. Flip X because video is mirrored
            const flippedX = 1.0 - mpX;
            const flippedY = mpY;

            // 2. Account for object-fit: cover cropping
            const videoRatio = video.videoWidth / video.videoHeight;
            const windowRatio = window.innerWidth / window.innerHeight;
            
            let renderWidth, renderHeight, offsetX = 0, offsetY = 0;
            
            if (windowRatio > videoRatio) {
                // Screen is wider than video
                renderWidth = window.innerWidth;
                renderHeight = window.innerWidth / videoRatio;
                offsetY = (window.innerHeight - renderHeight) / 2;
            } else {
                // Screen is taller than video
                renderHeight = window.innerHeight;
                renderWidth = window.innerHeight * videoRatio;
                offsetX = (window.innerWidth - renderWidth) / 2;
            }

            // 3. Calculate exact pixel position on screen
            const pixelX = (flippedX * renderWidth) + offsetX;
            const pixelY = (flippedY * renderHeight) + offsetY;

            // 4. Convert to Three.js Normalized Device Coordinates (-1 to +1)
            const ndcX = (pixelX / window.innerWidth) * 2 - 1;
            const ndcY = -(pixelY / window.innerHeight) * 2 + 1;

            // 5. Project to 3D space
            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            vector.sub(camera.position).normalize();
            const distance = zDepth / vector.z;
            return camera.position.clone().add(vector.multiplyScalar(distance));
        }

        function onResults(results) {
            if (!isInitialized && video.videoWidth > 0) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
                isInitialized = true;
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && bracesModel) {
                faceDetected = true;
                const landmarks = results.multiFaceLandmarks[0];
                
                const left = landmarks[LANDMARKS.mouthLeft];
                const right = landmarks[LANDMARKS.mouthRight];
                const upper = landmarks[LANDMARKS.upperLip];
                const lower = landmarks[LANDMARKS.lowerLip];

                // Check if mouth is open
                const mouthOpenDist = Math.abs(lower.y - upper.y);
                isMouthOpen = mouthOpenDist > CONFIG.mouthThreshold;

                if (isMouthOpen) {
                    // 1. Calculate X Center (Guarantees it doesn't drift left/right)
                    const centerX = (left.x + right.x) / 2;
                    
                    // 2. Calculate Y Anchor
                    const anchorY = currentTarget === 'upper' ? upper.y : lower.y;
                    const yOffset = currentTarget === 'upper' ? CONFIG.yOffsetUpper : CONFIG.yOffsetLower;
                    
                    // Apply perfect alignment math
                    targetPosition = getPerfect3DPosition(centerX, anchorY + yOffset, CONFIG.depthZ);

                    // 3. Calculate Scale
                    const mouthWidth = Math.sqrt(Math.pow(right.x - left.x, 2) + Math.pow(right.y - left.y, 2));
                    const s = mouthWidth * Math.abs(CONFIG.depthZ) * CONFIG.baselineScale;
                    targetScale.set(s, s, s);

                    // 4. Calculate 3D Rotation (Adjusted for mirror)
                    const rollZ = Math.atan2(right.y - left.y, right.x - left.x); 
                    const yawY = Math.atan2(right.z - left.z, right.x - left.x) * 1.5; 
                    
                    targetRotation.set(0, -yawY, -rollZ);
                    targetQuaternion.setFromEuler(targetRotation);
                }
            } else {
                faceDetected = false;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (bracesModel) {
                if (faceDetected && isMouthOpen) {
                    bracesModel.visible = true;
                    // Smooth tracking
                    bracesModel.position.lerp(targetPosition, CONFIG.smoothness);
                    bracesModel.scale.lerp(targetScale, CONFIG.smoothness);
                    bracesModel.quaternion.slerp(targetQuaternion, CONFIG.smoothness);
                } else {
                    bracesModel.visible = false;
                }
            }
            renderer.render(scene, camera);
        }

        function initMediaPipe() {
            const faceMesh = new FaceMesh({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
            }});

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            faceMesh.onResults(onResults);

            const cameraUtils = new Camera(video, {
                onFrame: async () => { await faceMesh.send({image: video}); },
                // Use standard HD resolution, the math will handle the cropping automatically
                width: 1280, 
                height: 720
            });

            cameraUtils.start();
        }

        window.onload = () => {
            initThreeJS();
            initMediaPipe();
        };
    </script>
</body>
</html>
