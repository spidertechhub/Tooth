<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport fix to prevent mobile browser UI from breaking the 3D alignment -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WebAR Braces - 100% Curve Alignment</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root { --primary: #007AFF; --bg-glass: rgba(20, 20, 20, 0.8); --border-glass: rgba(255, 255, 255, 0.2); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; position: fixed; top: 0; left: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* Container acts as the absolute source of truth for screen dimensions */
        #app-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        #webcam-video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; }
        #ar-canvas { position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        .ui-overlay { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; background: var(--bg-glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); padding: 10px; border-radius: 50px; border: 1px solid var(--border-glass); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }
        .toggle-btn { display: none; }
        .toggle-label { padding: 12px 24px; border-radius: 30px; color: #ccc; font-weight: bold; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .toggle-btn:checked + .toggle-label { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.6); }
        
        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; transition: opacity 0.5s ease; }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Aligning AR Engine...</div>
    </div>

    <div id="app-container">
        <video id="webcam-video" autoplay playsinline muted></video>
        <canvas id="ar-canvas"></canvas>
    </div>

    <div class="ui-overlay">
        <input type="radio" id="upper" name="teeth-toggle" value="upper" class="toggle-btn" checked>
        <label for="upper" class="toggle-label">Upper Teeth</label>
        
        <input type="radio" id="lower" name="teeth-toggle" value="lower" class="toggle-btn">
        <label for="lower" class="toggle-label">Lower Teeth</label>
    </div>

    <script>
        /**
         * ⚙️ ADVANCED CURVE & ALIGNMENT CONFIG
         */
        const CONFIG = {
            // SCALE: Adjust this if the braces are too wide/narrow for your mouth
            modelScale: 1.05,   
            
            // PROPORTIONAL OFFSETS: 
            // Instead of guessing pixels, this moves the braces up/down based on a % of your mouth width.
            // Positive = Down. Negative = Up.
            upperTeethOffsetPct: 0.04,  // Pushes it slightly down from the upper lip
            lowerTeethOffsetPct: -0.06, // Pushes it slightly UP from the lower lip (fixes your 2nd image)

            // ROTATION FIX: Lays the 3D model flat against the teeth
            rotX: 90, rotY: 0, rotZ: 0,

            depthZ: -40, // Brought slightly closer for better 3D depth rendering
            smoothness: 0.5 // High smoothness for realistic tracking
        };

        const LANDMARKS = { mouthLeft: 61, mouthRight: 291, upperLip: 13, lowerLip: 14 };

        const container = document.getElementById('app-container');
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('ar-canvas');
        const loader = document.getElementById('loader');
        const toggles = document.querySelectorAll('input[name="teeth-toggle"]');

        let currentTarget = 'upper';
        let isInitialized = false, isMouthOpen = false, faceDetected = false;

        let targetPosition = new THREE.Vector3();
        let targetScale = new THREE.Vector3();
        let targetQuaternion = new THREE.Quaternion();

        let scene, camera, renderer, bracesModel;

        toggles.forEach(toggle => { toggle.addEventListener('change', (e) => { currentTarget = e.target.value; }); });

        function initThreeJS() {
            scene = new THREE.Scene();
            // Use container dimensions to ignore mobile browser UI bars
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 0;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(0, 5, 10);
            scene.add(dirLight);

            new THREE.GLTFLoader().load('braces.glb', (gltf) => {
                const baseModel = gltf.scene;
                
                // 1. Center the model exactly
                const box = new THREE.Box3().setFromObject(baseModel);
                const center = box.getCenter(new THREE.Vector3());
                baseModel.position.sub(center);
                
                // 2. Auto-Normalize (Forces model to be exactly 1 unit wide)
                const size = box.getSize(new THREE.Vector3());
                const normalizeScale = 1 / size.x;
                baseModel.scale.set(normalizeScale, normalizeScale, normalizeScale);

                // 3. Fix initial rotation
                baseModel.rotation.set(
                    THREE.MathUtils.degToRad(CONFIG.rotX),
                    THREE.MathUtils.degToRad(CONFIG.rotY),
                    THREE.MathUtils.degToRad(CONFIG.rotZ)
                );
                
                const pivotGroup = new THREE.Group();
                pivotGroup.add(baseModel);
                bracesModel = pivotGroup;
                bracesModel.visible = false;
                scene.add(bracesModel);
                
                document.getElementById('loader-text').innerText = "Starting Camera...";
            });

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            animate();
        }

        // Perfect 3D Mapping (Immune to mobile aspect ratio stretching)
        function getPerfect3DPosition(mpX, mpY, zDepth) {
            const flippedX = 1.0 - mpX;
            const videoRatio = video.videoWidth / video.videoHeight;
            const windowRatio = container.clientWidth / container.clientHeight;
            
            let renderWidth, renderHeight, offsetX = 0, offsetY = 0;
            
            if (windowRatio > videoRatio) {
                renderWidth = container.clientWidth;
                renderHeight = container.clientWidth / videoRatio;
                offsetY = (container.clientHeight - renderHeight) / 2;
            } else {
                renderHeight = container.clientHeight;
                renderWidth = container.clientHeight * videoRatio;
                offsetX = (container.clientWidth - renderWidth) / 2;
            }

            const pixelX = (flippedX * renderWidth) + offsetX;
            const pixelY = (mpY * renderHeight) + offsetY;

            const ndcX = (pixelX / container.clientWidth) * 2 - 1;
            const ndcY = -(pixelY / container.clientHeight) * 2 + 1;

            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            vector.sub(camera.position).normalize();
            return camera.position.clone().add(vector.multiplyScalar(zDepth / vector.z));
        }

        function onResults(results) {
            if (!isInitialized && video.videoWidth > 0) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
                isInitialized = true;
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && bracesModel) {
                faceDetected = true;
                const lm = results.multiFaceLandmarks[0];
                
                const left = lm[LANDMARKS.mouthLeft];
                const right = lm[LANDMARKS.mouthRight];
                const upper = lm[LANDMARKS.upperLip];
                const lower = lm[LANDMARKS.lowerLip];

                isMouthOpen = Math.abs(lower.y - upper.y) > 0.01;

                if (isMouthOpen) {
                    // 1. Convert Landmarks to True 3D Space
                    const pLeft = getPerfect3DPosition(left.x, left.y, CONFIG.depthZ);
                    const pRight = getPerfect3DPosition(right.x, right.y, CONFIG.depthZ);
                    const pUpper = getPerfect3DPosition(upper.x, upper.y, CONFIG.depthZ);
                    const pLower = getPerfect3DPosition(lower.x, lower.y, CONFIG.depthZ);

                    // 2. Calculate True 3D Width
                    const mouthWidth3D = pLeft.distanceTo(pRight);

                    // 3. PERFECT POSITIONING (Proportional to mouth size)
                    const isUpper = currentTarget === 'upper';
                    const anchorPoint = isUpper ? pUpper : pLower;
                    const offsetPct = isUpper ? CONFIG.upperTeethOffsetPct : CONFIG.lowerTeethOffsetPct;
                    
                    // Apply offset dynamically based on how wide the mouth is
                    targetPosition.copy(anchorPoint);
                    targetPosition.y -= (mouthWidth3D * offsetPct); // Minus because Y goes up in 3D
                    
                    // Ensure it stays perfectly centered horizontally
                    targetPosition.x = (pLeft.x + pRight.x) / 2;

                    // 4. SCALE
                    const s = mouthWidth3D * CONFIG.modelScale;
                    targetScale.set(s, s, s);

                    // 5. PERFECT CURVE ALIGNMENT (Vector Cross Products)
                    // This creates a 3D plane that exactly matches the tilt, pan, and roll of your teeth.
                    const xAxis = new THREE.Vector3().subVectors(pRight, pLeft).normalize();
                    const yAxis = new THREE.Vector3().subVectors(pUpper, pLower).normalize();
                    const zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis).normalize();
                    
                    // Re-orthogonalize Y to ensure perfect 90 degree angles
                    yAxis.crossVectors(zAxis, xAxis).normalize();

                    // Build a rotation matrix from these vectors
                    const rotationMatrix = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
                    targetQuaternion.setFromRotationMatrix(rotationMatrix);
                }
            } else {
                faceDetected = false;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (bracesModel) {
                if (faceDetected && isMouthOpen) {
                    bracesModel.visible = true;
                    // Apply smooth tracking
                    bracesModel.position.lerp(targetPosition, CONFIG.smoothness);
                    bracesModel.scale.lerp(targetScale, CONFIG.smoothness);
                    bracesModel.quaternion.slerp(targetQuaternion, CONFIG.smoothness);
                } else {
                    bracesModel.visible = false;
                }
            }
            renderer.render(scene, camera);
        }

        function initMediaPipe() {
            const faceMesh = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
            faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
            faceMesh.onResults(onResults);

            const cameraUtils = new Camera(video, {
                onFrame: async () => { await faceMesh.send({image: video}); },
                facingMode: 'user'
            });

            cameraUtils.start();
        }

        window.onload = () => { initThreeJS(); initMediaPipe(); };
    </script>
</body>
</html>
